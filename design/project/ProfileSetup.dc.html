<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; display: flex; flex-direction: column; overflow: hidden">

      </a>
      <div style="flex: 1">
        <h1 style="margin: 0; font-size: 16px; font-weight: 600; color: #15201A">عرّفنا بنفسك</h1>
        <p style="margin: 2px 0 0; font-size: 12px; color: #4F5D55">الخطوة ٢ من ٣</p>
      </div>
    </div>
    <div style="display: flex; gap: 5px">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #0D3B2E"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #0D3B2E"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #E6E0D2"></span>

  </header>

  <div style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

    <section>
      <p style="margin: 0 0 9px; font-size: 13px; font-weight: 600; color: #15201A">الجنس <span style="font-weight: 400; color: #4F5D55">— لمطابقتك بالمعلّم المناسب</span></p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 50px; border-radius: 13px; border: 2px solid #0D3B2E; background: #0D3B2E; color: #F3E7C8; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">ذكر</button>
        <button type="button" style="height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; color: #15201A; font-family: inherit; font-size: 14px; cursor: pointer">أنثى</button>
      </div>
      <p style="margin: 9px 0 0; font-size: 11px; color: #4F5D55; line-height: 1.8">الطالبات يَظهر لهنّ المعلّمات فقط ما لم يُغيّرن ذلك من الإعدادات.</p>
    </section>

    <section>
      <label for="country" style="display: block; font-size: 13px; font-weight: 600; color: #15201A; margin-bottom: 9px">الدولة والمنطقة الزمنية</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; padding: 0 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15 0 18-2.5-3-2.5-15.3 0-18"/></svg>
        <span id="country" style="flex: 1; font-size: 14px; color: #15201A">الأردن · عمّان (UTC+3)</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </section>

    <section>
      <p style="margin: 0 0 9px; font-size: 13px; font-weight: 600; color: #15201A">هدفي من التطبيق</p>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <button type="button" style="display: flex; align-items: center; gap: 11px; border: 2px solid #0D3B2E; background: #fff; border-radius: 14px; padding: 13px; text-align: right; font-family: inherit; cursor: pointer; width: 100%; box-sizing: border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D3B2E" stroke-width="1.8" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-2.3L17 21l-1.5-7.5"/></svg>
          <span style="flex: 1">
            <span style="display: block; font-size: 13.5px; font-weight: 600; color: #15201A">إجازة بالسند</span>
            <span style="display: block; margin-top: 3px; font-size: 11px; color: #4F5D55">قراءة القرآن كاملًا على شيخ</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0D3B2E" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5 5.5-5.5" fill="none" stroke="#fff" stroke-width="2"/></svg>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 11px; border: 1px solid #E3DCCD; background: #fff; border-radius: 14px; padding: 13px; text-align: right; font-family: inherit; cursor: pointer; width: 100%; box-sizing: border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="1.8" aria-hidden="true" style="flex-shrink: 0"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>
          <span style="flex: 1">
            <span style="display: block; font-size: 13.5px; font-weight: 600; color: #15201A">حفظ ومراجعة</span>
            <span style="display: block; margin-top: 3px; font-size: 11px; color: #4F5D55">تثبيت الحفظ مع متابعة أسبوعية</span>
          </span>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 11px; border: 1px solid #E3DCCD; background: #fff; border-radius: 14px; padding: 13px; text-align: right; font-family: inherit; cursor: pointer; width: 100%; box-sizing: border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="1.8" aria-hidden="true" style="flex-shrink: 0"><path d="M12 6v13M5 9c0-2 3-3 7-3s7 1 7 3"/><path d="M5 9v9c0 2 3 3 7 3s7-1 7-3V9"/></svg>
          <span style="flex: 1">
            <span style="display: block; font-size: 13.5px; font-weight: 600; color: #15201A">تصحيح التلاوة</span>
            <span style="display: block; margin-top: 3px; font-size: 11px; color: #4F5D55">أحكام التجويد والمخارج</span>
          </span>
        </button>
      </div>
    </section>

    <section>
      <p style="margin: 0 0 9px; font-size: 13px; font-weight: 600; color: #15201A">الرواية المطلوبة</p>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #0D3B2E; color: #F3E7C8; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer">حفص عن عاصم</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D9D2C3; background: #fff; color: #15201A; font-family: inherit; font-size: 12.5px; cursor: pointer">ورش</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D9D2C3; background: #fff; color: #15201A; font-family: inherit; font-size: 12.5px; cursor: pointer">قالون</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D9D2C3; background: #fff; color: #15201A; font-family: inherit; font-size: 12.5px; cursor: pointer">العشر</button>
      </div>
    </section>

  </div>

  <div style="background: #fff; border-top: 1px solid #ECE6D9; padding: 12px 20px 22px">
    <a href="Teachers.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #0D3B2E; color: #F3E7C8; font-size: 15px; font-weight: 600">اعرض لي المشايخ المناسبين</a>
  </div>

</div>
