<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مُجاز — إنشاء حساب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
a { color: #0D3B2E; text-decoration: none; }
a:hover { color: #8A6D14; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 10px">
    <a href="Main.dc.html" aria-label="رجوع" style="width: 36px; height: 36px; border-radius: 11px; border: 1px solid #E3DCCD; background: #fff; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15201A" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </header>

  <div style="flex: 1; padding: 6px 24px 0; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

    <div>
      <h1 style="margin: 0; font-family: Amiri, serif; font-size: 32px; font-weight: 700; color: #0D3B2E">إنشاء حساب</h1>
      <p style="margin: 8px 0 0; font-size: 13px; color: #4F5D55; line-height: 1.8">خطوة واحدة ويبدأ طريقك إلى الإجازة.</p>
    </div>

    <div>
      <p style="margin: 0 0 9px; font-size: 13px; font-weight: 600; color: #15201A">أنا أسجّل بصفتي</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="border: 2px solid #0D3B2E; background: #0D3B2E; border-radius: 15px; padding: 14px 12px; text-align: right; font-family: inherit; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4AF5A" stroke-width="1.8" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4z"/><path d="M7 10v5c0 1.7 2.2 3 5 3s5-1.3 5-3v-5"/></svg>
          <p style="margin: 9px 0 0; font-size: 14px; font-weight: 600; color: #F6F2E8">طالب</p>
          <p style="margin: 3px 0 0; font-size: 11px; color: #9FB6AB">أريد القراءة على شيخ</p>
        </button>
        <button type="button" style="border: 1px solid #E3DCCD; background: #fff; border-radius: 15px; padding: 14px 12px; text-align: right; font-family: inherit; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D3B2E" stroke-width="1.8" aria-hidden="true"><path d="M6 4h9l4 4v12H6z"/><path d="M15 4v4h4M9 13h6"/></svg>
          <p style="margin: 9px 0 0; font-size: 14px; font-weight: 600; color: #15201A">شيخ مُجاز</p>
          <p style="margin: 3px 0 0; font-size: 11px; color: #4F5D55">أريد الإقراء والإجازة</p>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px">
      <div>
        <label for="name" style="display: block; font-size: 12px; color: #4F5D55; margin-bottom: 6px">الاسم الكامل</label>
        <input id="name" type="text" placeholder="أحمد طارق العبّادي" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; padding: 0 14px; font-family: inherit; font-size: 14px; color: #15201A">
      </div>
      <div>
        <label for="email" style="display: block; font-size: 12px; color: #4F5D55; margin-bottom: 6px">البريد الإلكتروني</label>
        <input id="email" type="email" placeholder="name@example.com" dir="ltr" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; padding: 0 14px; font-family: inherit; font-size: 14px; color: #15201A; text-align: left">
      </div>
      <div>
        <label for="pass" style="display: block; font-size: 12px; color: #4F5D55; margin-bottom: 6px">كلمة المرور</label>
        <input id="pass" type="password" placeholder="٨ أحرف على الأقل" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; padding: 0 14px; font-family: inherit; font-size: 14px; color: #15201A">
      </div>
    </div>

    <a href="ProfileSetup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #0D3B2E; color: #F3E7C8; font-size: 15px; font-weight: 600">متابعة</a>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; height: 1px; background: #E6E0D2"></span>
      <span style="font-size: 11.5px; color: #4F5D55">أو</span>
      <span style="flex: 1; height: 1px; background: #E6E0D2"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; color: #15201A; font-family: inherit; font-size: 14px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        المتابعة برقم الجوال
      </button>
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 50px; border-radius: 13px; border: 1px solid #E3DCCD; background: #fff; color: #15201A; font-family: inherit; font-size: 14px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5D55" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        المتابعة بحساب Google
      </button>
    </div>
  </div>

  <div style="padding: 14px 24px 26px">
    <p style="margin: 0; text-align: center; font-size: 11.5px; color: #4F5D55; line-height: 1.8">
      بالمتابعة فإنك توافق على <a href="Account.dc.html" style="color: #0D3B2E; font-weight: 600">الشروط</a> و<a href="Account.dc.html" style="color: #0D3B2E; font-weight: 600">سياسة الخصوصية</a>
    </p>
  </div>

</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
